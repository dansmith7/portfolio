<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Портфолио</title>
    <!-- Preconnect к Supabase — ускоряет первые запросы к API (инжектится при сборке) -->
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        var h = window.location.hostname;
        if (h === 'localhost' || h === '127.0.0.1') {
          var el = document.createElement('div');
          el.id = 'dev-badge';
          el.style.cssText = 'position:fixed;bottom:12px;right:12px;padding:10px 18px;background:#22c55e;color:#fff;font-size:16px;font-weight:700;border-radius:8px;z-index:2147483647;box-shadow:0 4px 16px rgba(0,0,0,0.4);font-family:system-ui,sans-serif';
          el.textContent = 'DEV: localhost';
          document.body.appendChild(el);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx?v=1"></script>
  </body>
</html>
